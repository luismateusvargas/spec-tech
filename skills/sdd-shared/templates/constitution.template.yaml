# Full YAML constitution for SaaS or game projects.
# Required: id, scope, rules, logging, quality_gates, change_policy, project_ref.
# Unanswered required value: null + open_decisions item + status: blocked.
# Remove optional fields that do not apply; use repository-relative references.
constitution:
  id: null
  status: blocked # draft | blocked | adopted
  version: "0.1.0"
  project_ref: null
  scope: null
  rules:
    - id: null
      statement: null
      rationale: null
      applies_to: null
      verification: null
  logging:
    info: null # normal significant events and outcomes; what context to record
    warning: null # recoverable or unusual conditions needing attention
    error: null # failed operations requiring investigation or action
    debug: null # diagnostic detail, with when it may be enabled
    safeguards: null # existing logger/configuration, sensitive-data rules, and noise limits
    coverage_gaps: [] # verified code paths missing required logging; feed scoped plans
  quality_gates:
    - id: null
      check: null
      expected_result: null
  change_policy:
    approver: null
    revision_process: null
  evidence: [] # file, current primary URL, or user-confirmed decision reference with supported claim
  open_decisions: [] # {field: constitution.scope, question: ..., owner: ...}
