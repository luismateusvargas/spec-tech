[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-tech-sdd-engine"
version = "2.0.0"
description = "Pointer-based LangGraph orchestration engine for Spec-Tech SDD workflows"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "mcp>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "typing-extensions>=4.12",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1.0",
]

[tool.setuptools]
packages = ["sdd_engine"]

[tool.setuptools.data-files]
"share/spec-tech-sdd-engine/skills/javascript-dev" = ["skills/javascript-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/typescript-dev" = ["skills/typescript-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/python-dev" = ["skills/python-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/rust-dev" = ["skills/rust-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/go-dev" = ["skills/go-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/cpp-dev" = ["skills/cpp-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/cpp-cv-dev" = ["skills/cpp-cv-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/cpp-aaa-dev" = ["skills/cpp-aaa-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/database-dev" = ["skills/database-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/react-dev" = ["skills/react-dev/SKILL.md"]
"share/spec-tech-sdd-engine/skills/vue-dev" = ["skills/vue-dev/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["docker: runs real containers; skipped when the daemon or image is unavailable"]
